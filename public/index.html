<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presensi Workshop Guru</title>
<style>html,body{height:100%;margin:0;font-family:system-ui,sans-serif;background:#0b1437;color:#fff}
body{display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}a{color:#93c5fd}</style></head>
<body><p id="m">Membuka aplikasi presensi...</p>
<script>
/* 1) Ganti dengan alamat /exec dari Apps Script (Deploy > Manage deployments) */
const GAS = 'https://script.google.com/macros/s/AKfycbywnbuqW1IQqPYdVYH0kn6aZoMsh8xaiD_TmjVUJehnbblcGLu9Y9yZMD4H2AoPDz4LGA/exec';
/* 2) 'redirect' = pindah ke alamat Apps Script (paling stabil, disarankan)
      'iframe'   = alamat workers.dev tetap tampil di browser */
const MODE = 'redirect';

const url = GAS + location.search + location.hash; /* ?k=... dan ?verify=... ikut diteruskan */
const m = document.getElementById('m');
if (GAS.indexOf('GANTI_DENGAN') > -1) {
  m.textContent = 'Alamat Apps Script belum diisi pada file public/index.html.';
} else if (MODE === 'iframe') {
  const f = document.createElement('iframe'); f.src = url; f.allow = 'clipboard-write'; document.body.appendChild(f);
} else {
  location.replace(url);
  m.innerHTML = 'Jika tidak berpindah otomatis, <a href="' + url + '">klik di sini</a>.';
}
</script></body></html>
